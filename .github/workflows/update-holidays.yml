name: Update public holidays

on:
  schedule:
    # Daily at 19:00 UTC (5 am Sydney AEST / 6 am AEDT)
    - cron: "0 19 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Read the latest Fair Work public holiday lists
        run: node .github/scripts/update-holidays.mjs
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add holidays.json
          if ! git diff --staged --quiet; then
            git commit -m "Update public holidays"
            git push
          fi
