name: Update news

on:
  schedule:
    # Every hour, on the hour (UTC). GitHub may start a run a few minutes late.
    - cron: "0 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Fetch latest headlines
        run: node .github/scripts/update-news.mjs
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add news.json
          if ! git diff --staged --quiet; then
            git commit -m "Update news"
            git push
          fi
