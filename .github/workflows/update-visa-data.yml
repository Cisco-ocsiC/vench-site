name: Update visa data

on:
  schedule:
    # Daily at 18:30 UTC (about 5:30 am Sydney)
    - cron: "30 18 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Read the latest Home Affairs data
        run: node .github/scripts/update-visa-data.mjs
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/*.json
          if ! git diff --staged --quiet; then
            git commit -m "Update visa data"
            git push
          fi
